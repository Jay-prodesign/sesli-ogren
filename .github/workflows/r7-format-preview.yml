name: r7-format-preview

on:
  push:
    branches: [proof/round7-native-tts-capture]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false
      - run: dart format lib/main.dart lib/src/native_tts_capture.dart
      - name: Print formatter diff
        working-directory: .
        run: git diff -- proof/round7-p1-runtime/lib/main.dart proof/round7-p1-runtime/lib/src/native_tts_capture.dart
