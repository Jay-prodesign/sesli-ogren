name: m5-final-test-diagnostic

on:
  push:
    branches:
      - feat/m5-golden-learning-slice
    paths:
      - ".github/workflows/m5-final-test-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m5-golden-learning-slice

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Instrument source-entry widget boot
        working-directory: app
        run: |
          cat > test/_m5_smoke_boot_diagnostic_test.dart <<'DART'
          import 'dart:typed_data';

          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:sesli_ogren/src/app/app_runtime.dart';
          import 'package:sesli_ogren/src/app/learning_slice_screen.dart';
          import 'package:sesli_ogren/src/data/pdf_text_extractor.dart';
          import 'package:sesli_ogren/src/data/source_ingest_service.dart';
          import 'package:sesli_ogren/src/data/sqlite_source_store.dart';
          import 'package:sesli_ogren/src/learning/recall_learning_service.dart';
          import 'package:sqflite_common_ffi/sqflite_ffi.dart';

          class _UnusedPdfExtractor implements PdfTextExtractor {
            const _UnusedPdfExtractor();

            @override
            Future<ExtractedPdf> extract(
              Uint8List bytes, {
              required String sourceName,
            }) {
              throw UnimplementedError();
            }
          }

          void main() {
            sqfliteFfiInit();

            testWidgets(
              'diagnose source-entry widget boot',
              (tester) async {
                debugPrint('SMOKE_DIAG A before store open');
                final store = await SqliteSourceStore.open(
                  factory: databaseFactoryFfi,
                  path: inMemoryDatabasePath,
                );
                debugPrint('SMOKE_DIAG B store open');

                final runtime = AppRuntime(
                  learner: AppRuntime.localM5LearnerFixture,
                  store: store,
                  ingest: SourceIngestService(
                    store: store,
                    pdfTextExtractor: const _UnusedPdfExtractor(),
                  ),
                  recall: RecallLearningService(
                    sourceStore: store,
                    learningStore: store.learningTruthStore(),
                  ),
                  telemetry: store.operationalTelemetry(),
                );

                debugPrint('SMOKE_DIAG C before pumpWidget');
                await tester.pumpWidget(
                  MaterialApp(
                    home: MediaQuery(
                      data: const MediaQueryData(disableAnimations: true),
                      child: LearningSliceScreen(runtime: runtime),
                    ),
                  ),
                );
                debugPrint('SMOKE_DIAG D after pumpWidget');

                var found = false;
                for (var i = 0; i < 100; i++) {
                  await tester.runAsync(() async {
                    await Future<void>.delayed(
                      const Duration(milliseconds: 5),
                    );
                  });
                  if (i % 10 == 0) {
                    debugPrint('SMOKE_DIAG YIELD $i');
                  }
                  await tester.pump(const Duration(milliseconds: 20));
                  if (find.text('Çalışma materyalini ekle').evaluate().isNotEmpty) {
                    found = true;
                    debugPrint('SMOKE_DIAG E source found at $i');
                    break;
                  }
                }

                if (!found) {
                  fail('SMOKE_DIAG source state not reached');
                }

                debugPrint('SMOKE_DIAG F before unmount');
                await tester.pumpWidget(const SizedBox.shrink());
                await tester.pump();
                debugPrint('SMOKE_DIAG G before close');
                await tester.runAsync(store.close);
                debugPrint('SMOKE_DIAG H closed');
              },
              timeout: const Timeout(Duration(seconds: 45)),
            );
          }
          DART

          timeout 90s flutter test test/_m5_smoke_boot_diagnostic_test.dart -r expanded
          rm -f test/_m5_smoke_boot_diagnostic_test.dart
