name: round7-voice-evidence-validator

# R7-07A evidence-structure checks only. Read-only, standard-library tooling.
# No TTS provider call, credentials, paid quota or candidate selection occurs here.

on:
  push:
    branches: [proof/round7-turkish-voice-evidence]
    paths:
      - "proof/round7-voice-evidence/**"
      - ".github/workflows/round7-voice-evidence-validator.yml"
  pull_request:
    paths:
      - "proof/round7-voice-evidence/**"
      - ".github/workflows/round7-voice-evidence-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round7-voice-evidence-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate R7-07 voice evidence tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/validate_bootstrap.py
      - run: python3 scripts/test_validate_bootstrap.py
      - run: python3 proof/round7-voice-evidence/test_validate_voice_sample.py
      - run: python3 proof/round7-voice-evidence/test_validate_listening_panel.py
