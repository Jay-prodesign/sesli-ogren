name: round7-native-tts-format-preview

on:
  push:
    branches: [proof/round7-native-tts-capture]
    paths:
      - "proof/round7-p1-runtime/lib/main.dart"
      - "proof/round7-p1-runtime/lib/src/native_tts_capture.dart"
      - ".github/workflows/round7-native-tts-format-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false
      - name: Formatted main.dart
        run: dart format --output=show lib/main.dart
      - name: Formatted native_tts_capture.dart
        run: dart format --output=show lib/src/native_tts_capture.dart
