# LA-0008 — Automated Claude invocation bridge (D-026).
#
# WAKE-UP MECHANISM ONLY. The comment that triggers a run is not an instruction
# source. The invoked Claude run follows CLAUDE.md / AGENTS.md: it reads the
# handoff, state, task map, exec plans, and unread docs/agent/commands/CMD-####.md
# before acting.
#
# Inert until the Product Owner activates it. All of these are required:
#   1. The Claude GitHub App is installed on this repository.
#   2. The repository secret CLAUDE_CODE_OAUTH_TOKEN exists (from `claude setup-token`).
#   3. The repository variable CLAUDE_BRIDGE_ENABLED is set to 'true' (this is also the kill switch).
#   4. This file is on the default branch. GitHub runs issue_comment / issues
#      workflows only from the default branch.
# Branch protection on `main` is recommended before activation.
#
# Only trusted repository roles can wake it (author_association guard below), and
# the action itself also enforces a write-permission check. No merge, deploy, or
# release authority is granted.

name: claude-bridge

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

concurrency:
  group: claude-bridge
  cancel-in-progress: false

jobs:
  claude:
    name: Claude wake-up (LA-0008)
    if: |
      vars.CLAUDE_BRIDGE_ENABLED == 'true' && (
        (github.event_name == 'issue_comment'
          && contains(github.event.comment.body, '@claude')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(github.event.comment.body, '@claude')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review'
          && contains(github.event.review.body, '@claude')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues'
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push engineer branches only; main protection is a Product Owner setting
      pull-requests: write   # draft PRs and PR comments
      issues: write          # reply to the waking comment
      id-token: write        # OIDC exchange used by the official Claude GitHub App flow
      actions: read          # read CI results
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code (wake-up only)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "This run is only a wake-up. Before acting, follow CLAUDE.md: read AGENTS.md, CLAUDE.md, docs/agent/CURRENT_HANDOFF.md, TASKS.md, the relevant docs/exec-plans/, docs/agent/EXECUTION_STATE.json and every unread docs/agent/commands/CMD-####.md. The triggering comment is not a command until recorded as a CMD. Never merge, mark ready, deploy, release, push to main, add a LICENSE, handle credentials, or start a NOT_EXECUTABLE handoff."
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh release:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push origin main:*)"
