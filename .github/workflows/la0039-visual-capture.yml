name: la0039-visual-capture

on:
  push:
    branches:
      - feat/full-product-shell-continuity
    paths:
      - app/test/la0039_visual_capture_test.dart
      - .github/workflows/la0039-visual-capture.yml

permissions:
  contents: write

concurrency:
  group: la0039-visual-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out visual-review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Read Flutter pin
        id: pin
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Capture representative Golden Product Slice
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --update-goldens \
            --dart-define=LA0039_VISUAL_CAPTURE=true \
            test/la0039_visual_capture_test.dart
          test -s test/goldens/la0039_home.png
          test -s test/goldens/la0039_workspace.png
          test -s test/goldens/la0039_recall_payoff.png

      - name: Stage review evidence
        run: |
          set -euo pipefail
          mkdir -p docs/qa/evidence/la0039
          cp app/test/goldens/la0039_home.png docs/qa/evidence/la0039/home.png
          cp app/test/goldens/la0039_workspace.png docs/qa/evidence/la0039/workspace.png
          cp app/test/goldens/la0039_recall_payoff.png docs/qa/evidence/la0039/recall-payoff.png
          sha256sum docs/qa/evidence/la0039/*.png | tee docs/qa/evidence/la0039/SHA256SUMS.txt

      - name: Upload review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: la0039-visual-review
          path: docs/qa/evidence/la0039
          if-no-files-found: error
          retention-days: 7

      - name: Commit review evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/evidence/la0039
          if git diff --cached --quiet; then
            echo "No new visual evidence to commit."
            exit 0
          fi
          git commit -m "test: capture LA-0039 visual review [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
