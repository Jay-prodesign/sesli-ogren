name: m5-platform-validation

on:
  push:
    branches:
      - feat/m5-golden-learning-slice
    paths:
      - ".github/workflows/m5-platform-validation.yml"
      - "server/db/migrations/**"
      - "server/db/tests/**"
      - "scripts/m5_validate_server_sql.sh"

permissions:
  contents: read

jobs:
  server-sql:
    name: server-sql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGADMIN: supabase_admin
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Supabase-like owner role
        run: |
          psql -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgres') THEN
              CREATE ROLE postgres
                LOGIN PASSWORD 'postgres'
                NOSUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS;
            END IF;
          END
          $$;
          SQL

      - name: Run combined M5 SQL suite
        run: bash scripts/m5_validate_server_sql.sh m5-server-sql-report.txt

      - name: Upload SQL report
        uses: actions/upload-artifact@v4
        with:
          name: m5-server-sql-report
          path: m5-server-sql-report.txt
          if-no-files-found: error

  ios-profile:
    name: ios-profile
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Resolve locked dependencies
        working-directory: app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Build iOS profile without codesign
        working-directory: app
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_CLIENT_CONFIG_PRESENT=true"
            flutter build ios --profile --no-codesign               --dart-define=SUPABASE_URL="$SUPABASE_URL"               --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          else
            echo "SUPABASE_CLIENT_CONFIG_PRESENT=false"
            flutter build ios --profile --no-codesign
          fi

      - name: Fingerprint iOS app
        working-directory: app
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          find "$APP" -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256

  supabase-config:
    name: supabase-config-presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check protected client config presence only
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_CLIENT_CONFIG_PRESENT=true"
            echo "LIVE_AUTH_PROBE=NOT_RUN_REQUIRES_OWNER_AUTHORIZATION"
          else
            echo "SUPABASE_CLIENT_CONFIG_PRESENT=false"
            echo "LIVE_AUTH_PROBE=BLOCKED_MISSING_PROTECTED_CLIENT_VALUES"
          fi
