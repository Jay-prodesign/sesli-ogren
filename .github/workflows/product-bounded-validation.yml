name: product-bounded-validation

on:
  pull_request:
    paths:
      - "app/**"
      - ".flutter-version"
      - ".github/workflows/product-bounded-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone-gate:
    name: Milestone CI gate
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.check.outputs.run_full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: check
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$message" | grep -Fq "[product-ci]"; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$message" | grep -Fq "[milestone-ci]"; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "Skipping full product validation for routine or visual-only commit."
          fi

  validate:
    needs: milestone-gate
    if: needs.milestone-gate.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: product-bounded-validation-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: flutter_pin
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Canonical format
        run: |
          dart format .
          git diff --exit-code
      - run: flutter analyze
      - name: Core Golden Journey tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/golden_journey_test.dart
            test/product_shell_continuation_repair_test.dart
            test/product_home_next_action_test.dart
            test/first_value_intent_test.dart
            test/source_reader_screen_test.dart
            test/listen_playback_rate_test.dart
            test/durable_reopen_continuity_test.dart
            test/living_study_desk_home_test.dart
            test/recall_learning_service_test.dart
            test/flashcard_learning_service_test.dart
            test/flashcard_screen_test.dart
            test/quiz_learning_service_test.dart
          )
          for test_file in "${tests[@]}"; do
            echo "::group::core:${test_file}"
            timeout 75s flutter test --reporter expanded "${test_file}"
            echo "::endgroup::"
          done
      - name: Bounded expanded tests
        run: timeout 240s flutter test --reporter expanded
