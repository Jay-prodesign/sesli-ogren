name: m5-bounded-validation

on:
  push:
    branches:
      - feat/m5-golden-learning-slice
    paths:
      - "app/**"

concurrency:
  group: m5-bounded-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version
          test "$(cat .flutter-version)" = "3.47.5"

      - name: Resolve locked dependencies
        working-directory: app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Format check
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Focused PDF diagnostic
        working-directory: app
        run: timeout 60s flutter test test/_pdfrx_diagnostic_test.dart -r expanded
