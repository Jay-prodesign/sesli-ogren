name: m5-bounded-validation

on:
  push:
    branches:
      - feat/m5-golden-learning-slice
    paths:
      - "app/**"
      - ".github/workflows/m5-bounded-validation.yml"

concurrency:
  group: m5-bounded-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version
          test "$(cat .flutter-version)" = "3.47.5"

      - name: Resolve locked dependencies
        working-directory: app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Format check
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Real PDF engine probe
        working-directory: app
        run: |
          mkdir -p tool
          trap 'rm -f tool/_m5_pdf_engine_probe.dart' EXIT
          cat > tool/_m5_pdf_engine_probe.dart <<'DART'
          import 'dart:io';

          import 'package:pdfrx_engine/pdfrx_engine.dart';

          Future<void> main() async {
            await pdfrxInitialize();

            PdfDocument? document;
            try {
              document = await PdfDocument.openFile(
                'test/fixtures/two_page_text.pdf',
              );

              if (document.pages.length != 2) {
                throw StateError(
                  'Expected 2 PDF pages, got ${document.pages.length}.',
                );
              }

              final first = (await document.pages[0].loadText())?.fullText ?? '';
              final second = (await document.pages[1].loadText())?.fullText ?? '';

              if (!first.contains('Learning evidence page one')) {
                throw StateError('Expected page-one text was not extracted.');
              }
              if (!second.contains('Second page keeps provenance')) {
                throw StateError('Expected page-two text was not extracted.');
              }

              stdout.writeln(
                'PDF_ENGINE_PROBE PASS pages=${document.pages.length}',
              );
            } finally {
              await document?.dispose();
              await PdfrxEntryFunctions.instance.stopBackgroundWorker();
            }
          }
          DART

          timeout 180s dart run tool/_m5_pdf_engine_probe.dart

      - name: Test
        working-directory: app
        run: flutter test

      - name: Android profile build
        working-directory: app
        run: flutter build apk --profile

      - name: Verify PDFium packaging and APK SHA-256
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-profile.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "libpdfium.so"
          sha256sum "$APK"
