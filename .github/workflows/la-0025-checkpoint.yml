name: la-0025-checkpoint

on:
  pull_request:
    paths:
      - ".flutter-version"
      - "app/**"
      - "server/db/**"
      - "spike/architecture-proof/db/**"
      - ".github/workflows/la-0025-checkpoint.yml"

permissions:
  contents: read

concurrency:
  group: la-0025-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: flutter_pin
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: false
          pub-cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGPORT: "54329"
      PGADMIN: supabase_admin
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL 16 cluster
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          export PGHOST="$RUNNER_TEMP/pg"
          mkdir -p "$PGHOST"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U supabase_admin -A trust >/dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p $PGPORT -k $PGHOST -c listen_addresses=''" -l "$RUNNER_TEMP/pg.log" -w start
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
      - name: M4 base + production server deltas + tests
        run: |
          spike/architecture-proof/db/run_sql_suite.sh la_0025 spike/architecture-proof/db/migrations server/db/migrations server/db/tests
