name: full-product-checkpoint

on:
  pull_request:
    paths:
      - ".flutter-version"
      - "app/**"
      - ".github/workflows/full-product-checkpoint.yml"

permissions:
  contents: read

concurrency:
  group: full-product-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: flutter_pin
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: false
          pub-cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
