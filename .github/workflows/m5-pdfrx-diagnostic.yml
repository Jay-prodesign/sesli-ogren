name: m5-pdfrx-diagnostic

on:
  push:
    branches:
      - feat/m5-golden-learning-slice
    paths:
      - ".github/workflows/m5-pdfrx-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m5-golden-learning-slice
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Direct pdfrx diagnostic
        working-directory: app
        run: timeout 180s flutter test test/_pdfrx_diagnostic_test.dart -r expanded
