name: round7-p1-proof

# ROUND_7_P1_RUNTIME_PROOF_SPEC_001: exact-commit verification of the isolated P1 runtime proof
# (proof/round7-p1-runtime). Read-only; no secrets. Produces a profile-mode Android APK stamped with
# the commit SHA for physical-device runs (D2/D3) and an iOS profile compile check (D1 still needs a
# signed build on a Mac). CI results are functional/build evidence, not device performance evidence.
# Third-party actions are pinned to immutable SHAs (see proof/round7-p1-runtime/PROVENANCE.md).

on:
  push:
    branches: [proof/round7-companion-runtime]
    paths:
      - ".flutter-version"
      - "proof/round7-p1-runtime/**"
      - ".github/workflows/round7-p1-proof.yml"
  pull_request:
    paths:
      - ".flutter-version"
      - "proof/round7-p1-runtime/**"
      - ".github/workflows/round7-p1-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round7-p1-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Repository control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/validate_bootstrap.py
      - run: python3 scripts/test_validate_bootstrap.py

  flutter:
    name: P1 proof — analyze, test, profile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Render P9 visual QA captures
        run: flutter test --update-goldens tool/p9_visual_capture_test.dart

      - name: Upload P9 visual QA captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p9-visual-qa-${{ github.sha }}
          path: proof/round7-p1-runtime/tool/p9_captures/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build profile APK (proof) and empty-app baseline
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          flutter build apk --profile --dart-define=GIT_SHA=${GITHUB_SHA}
          flutter create --empty --platforms=android --project-name r7_baseline "$RUNNER_TEMP/baseline"
          (cd "$RUNNER_TEMP/baseline" && flutter build apk --profile)

      - name: Size report (package delta attributable to the proof)
        run: |
          proof=build/app/outputs/flutter-apk/app-profile.apk
          base="$RUNNER_TEMP/baseline/build/app/outputs/flutter-apk/app-profile.apk"
          assets=$(du -cb assets/fixtures/*.json | tail -1 | cut -f1)
          {
            echo "commit: ${GITHUB_SHA}"
            echo "flutter: $(flutter --version | head -1)"
            echo "proof_profile_apk_bytes: $(stat -c %s "$proof")"
            echo "baseline_empty_profile_apk_bytes: $(stat -c %s "$base")"
            echo "delta_bytes: $(( $(stat -c %s "$proof") - $(stat -c %s "$base") ))"
            echo "fixture_asset_bytes: ${assets}"
            echo "proof_apk_sha256: $(sha256sum "$proof" | cut -d' ' -f1)"
          } | tee size-report.txt
          { echo '### P1 size report'; echo '```'; cat size-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cp "$proof" "r7-p1-proof-profile-${GITHUB_SHA}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r7-p1-proof-profile-apk-${{ github.sha }}
          path: |
            proof/round7-p1-runtime/r7-p1-proof-profile-${{ github.sha }}.apk
            proof/round7-p1-runtime/size-report.txt
          if-no-files-found: error
          retention-days: 30

  ios-compile:
    name: P1 proof — iOS profile compile (no codesign)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false
      - run: flutter pub get
      - run: flutter build ios --profile --no-codesign --dart-define=GIT_SHA=${GITHUB_SHA}


  ios-native-tts-sim:
    name: P9 native TTS — iOS simulator
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false

      - run: flutter pub get

      - name: Boot available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d.get("isAvailable") and d.get("name","").startswith("iPhone")))')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter devices

      - name: Run native flutter_tts lifecycle probe
        run: flutter test integration_test/native_speech_plugin_test.dart -d "${{ steps.sim.outputs.udid }}"
