name: la-0026-checkpoint
on:
  push:
    branches: [feat/full-product-shell-continuity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: false
          pub-cache: false
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: dart format --output=none --set-exit-if-changed .
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client postgresql-16-pgtap
      - name: M4 base + production server deltas + tests
        run: |
          export PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=postgres
          psql -v ON_ERROR_STOP=1 -c 'create extension if not exists pgtap;'
          psql -v ON_ERROR_STOP=1 -f spike/architecture-proof/db/migrations/0001_canonical_core.sql
          psql -v ON_ERROR_STOP=1 -f spike/architecture-proof/db/migrations/0002_generation_rpcs.sql
          for f in server/db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          for f in server/db/tests/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
