name: la-0026-checkpoint
on:
  push:
    branches: [feat/full-product-shell-continuity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: false
          pub-cache: false
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: |
          dart format .
          git diff --exit-code -- .
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGPORT: "54329"
      PGADMIN: supabase_admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Start disposable PostgreSQL 16 cluster
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          export PGHOST="$RUNNER_TEMP/pg"
          mkdir -p "$PGHOST"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U supabase_admin -A trust >/dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p $PGPORT -k $PGHOST -c listen_addresses=''" -l "$RUNNER_TEMP/pg.log" -w start
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
      - name: M4 base + production server deltas + tests
        run: |
          spike/architecture-proof/db/run_sql_suite.sh la_0026 spike/architecture-proof/db/migrations server/db/migrations server/db/tests
