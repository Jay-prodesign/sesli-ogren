name: round7-web-preview

on:
  push:
    branches:
      - feat/round7-companion-production-sequence-v2
    paths:
      - ".flutter-version"
      - "proof/round7-p1-runtime/**"
      - ".github/workflows/round7-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: round7-web-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish phone preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proof/round7-p1-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read Flutter pin
        id: pin
        working-directory: .
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pin.outputs.version }}
          cache: false
          pub-cache: false

      - run: flutter pub get

      - name: Build web preview
        run: |
          flutter build web \
            --release \
            --base-href "/Jay-prodesign/sesli-ogren/web-preview/" \
            --dart-define=GIT_SHA=${{ github.sha }}
          printf '%s\n' "${GITHUB_SHA}" > build/web/PREVIEW_SHA.txt

      - name: Publish fixed preview branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="$RUNNER_TEMP/learning-app-web-preview"
          mkdir -p "$publish_dir"
          cp -a build/web/. "$publish_dir/"
          cd "$publish_dir"
          git init -b web-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:web-preview

      - name: Preview link
        working-directory: .
        run: |
          echo "### Phone preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://raw.githack.com/Jay-prodesign/sesli-ogren/web-preview/index.html" >> "$GITHUB_STEP_SUMMARY"
