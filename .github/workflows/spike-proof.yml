name: spike-proof

# LA-0017: re-runs the Architecture Proof SQL and Deno evidence in CI so reviewers can verify the
# exact head independently. Read-only; no secrets; no third-party actions beyond actions/checkout.
# PostgreSQL 16 is preinstalled on ubuntu-24.04 runners; Deno is fetched from its official release
# host and checksum-verified. Flutter client tests remain local-only evidence (toolchain size).

on:
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/spike-proof.yml"

permissions:
  contents: read

concurrency:
  group: spike-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Architecture Proof SQL + Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DENO_VERSION: "2.9.7"
      DENO_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
      PGPORT: "54329"
      PGADMIN: supabase_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start disposable PostgreSQL 16 cluster
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          export PGHOST="$RUNNER_TEMP/pg"
          mkdir -p "$PGHOST"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U supabase_admin -A trust >/dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p $PGPORT -k $PGHOST -c listen_addresses=''" -l "$RUNNER_TEMP/pg.log" -w start
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"

      - name: Canonical SQL proofs
        run: spike/architecture-proof/db/run_sql_suite.sh la_ci spike/architecture-proof/db/migrations spike/architecture-proof/db/tests

      - name: Install Deno (official release, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/deno.zip" "https://dl.deno.land/release/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"

      - name: Deno lint, type-check, tests (incl. real-Postgres integration)
        working-directory: spike/architecture-proof/functions
        env:
          LA_TEST_DB: la_ci
        run: |
          deno --version
          deno lint .
          deno check .
          deno test -A .
