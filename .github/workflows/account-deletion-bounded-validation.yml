name: account-deletion-bounded-validation

on:
  pull_request:
    paths:
      - "server/db/**"
      - "supabase/functions/delete-account/**"
      - "supabase/functions/generation-worker/**"
      - "supabase/functions/explain-back-evaluator/**"
      - "supabase/config.toml"
      - ".github/workflows/account-deletion-bounded-validation.yml"

permissions:
  contents: read

concurrency:
  group: account-deletion-bounded-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DENO_VERSION: "2.9.7"
      DENO_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
      PGPORT: "54329"
      PGADMIN: supabase_admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL 16 cluster
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          export PGHOST="$RUNNER_TEMP/pg"
          mkdir -p "$PGHOST"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U supabase_admin -A trust >/dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p $PGPORT -k $PGHOST -c listen_addresses=''" -l "$RUNNER_TEMP/pg.log" -w start
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
      - name: Account deletion SQL slice
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/migrations" "$tmp/tests"
          cp spike/architecture-proof/db/migrations/*.sql "$tmp/migrations/"
          cp server/db/migrations/*.sql "$tmp/migrations/"
          cp server/db/tests/50_grounded_explain_boundary.sql "$tmp/tests/"
          cp server/db/tests/51_grounded_explain_behavior.sql "$tmp/tests/"
          cp server/db/tests/70_account_deletion.sql "$tmp/tests/"
          cp server/db/tests/71_account_deletion_behavior.sql "$tmp/tests/"
          cp server/db/tests/80_generation_targeted_claim.sql "$tmp/tests/"
          cp server/db/tests/81_atomic_summary_submission.sql "$tmp/tests/"
          cp server/db/tests/82_distinct_grounded_explain.sql "$tmp/tests/"
          cp server/db/tests/83_explain_back_evaluator.sql "$tmp/tests/"
          cp server/db/tests/84_explain_back_quota.sql "$tmp/tests/"
          cp server/db/tests/85_explain_back_quota_recovery.sql "$tmp/tests/"
          report="$RUNNER_TEMP/account-deletion-sql-report.txt"
          if ! bash spike/architecture-proof/db/run_sql_suite.sh account_deletion "$tmp/migrations" "$tmp/tests" "$report"; then
            cat "$report" || true
            exit 1
          fi
          cat "$report"
      - name: Install Deno
        run: |
          curl -fsSL -o "$RUNNER_TEMP/deno.zip" "https://dl.deno.land/release/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"
      - name: Edge Function lint + type-check
        run: |
          deno lint supabase/functions/delete-account/index.ts supabase/functions/generation-worker/index.ts supabase/functions/explain-back-evaluator/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/generation-worker/index.ts
          deno check supabase/functions/explain-back-evaluator/index.ts
