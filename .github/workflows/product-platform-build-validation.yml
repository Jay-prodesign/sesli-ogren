name: product-platform-build-validation

on:
  pull_request:
    paths:
      - "app/lib/**"
      - "app/assets/**"
      - "app/android/**"
      - "app/ios/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - ".flutter-version"
      - ".github/workflows/product-platform-build-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone-gate:
    name: Milestone CI gate
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.check.outputs.run_full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git log -1 --pretty=%B | grep -Fq "[platform-ci]"; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Android/iOS build matrix unless this is a platform milestone."
          fi

  android-release-compile:
    needs: milestone-gate
    if: needs.milestone-gate.outputs.run_full == 'true'
    name: Android release compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: flutter_pin
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Compile Android internal dogfood APK
        env:
          INTERNAL_DOGFOOD_SIGNING: "true"
        run: |
          flutter build apk --release --no-pub
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK is install-signed
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload internal dogfood APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sesli-ogren-internal-dogfood-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7


  android-emulator-smoke:
    needs: [milestone-gate, android-release-compile]
    if: needs.milestone-gate.outputs.run_full == 'true' && needs.android-release-compile.result == 'success'
    name: Android emulator install + launch smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download signed dogfood APK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sesli-ogren-internal-dogfood-${{ github.event.pull_request.head.sha || github.sha }}
          path: dogfood-apk

      - name: Provision headless Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          AVDMANAGER="$(command -v avdmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$AVDMANAGER" ]; then
            AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager unavailable: $SDKMANAGER" >&2; exit 1; }
          test -x "$AVDMANAGER" || { echo "avdmanager unavailable: $AVDMANAGER" >&2; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR" || { echo "emulator unavailable after SDK install: $EMULATOR" >&2; exit 1; }

          AVD_HOME="$RUNNER_TEMP/sesli-ogren-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name sesli-dogfood --package "system-images;android-35;google_apis;x86_64"
          "$EMULATOR" -list-avds | tee "$RUNNER_TEMP/sesli-ogren-avds.txt"
          grep -Fxq "sesli-dogfood" "$RUNNER_TEMP/sesli-ogren-avds.txt" || {
            echo "AVD creation completed but emulator cannot discover sesli-dogfood." >&2
            find "$AVD_HOME" -maxdepth 2 -type f -print >&2 || true
            exit 1
          }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable; emulator will fall back to software acceleration." >&2
          fi

      - name: Boot emulator and launch APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVD_HOME="$RUNNER_TEMP/sesli-ogren-avd"
          export ANDROID_AVD_HOME="$AVD_HOME"
          test -f "$AVD_HOME/sesli-dogfood.ini"
          mkdir -p runtime-evidence
          ACCEL="-accel off"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL="-accel on"
          fi
          nohup "$EMULATOR"             -avd sesli-dogfood             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -no-snapshot-save             -no-metrics             -camera-back none             -camera-front none             -memory 2048             -gpu swiftshader_indirect             $ACCEL             > runtime-evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > runtime-evidence/emulator-pid.txt
          device_ready=""
          for _ in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before adb attached." >&2
              tail -n 200 runtime-evidence/emulator.log >&2 || true
              exit 1
            fi
            if "$ADB" devices | awk '$1 ~ /^emulator-/ && $2 == "device" { found=1 } END { exit(found ? 0 : 1) }'; then
              device_ready="1"
              break
            fi
            sleep 2
          done
          if [ "$device_ready" != "1" ]; then
            echo "Android emulator never became an adb device." >&2
            tail -n 200 runtime-evidence/emulator.log >&2 || true
            exit 1
          fi

          booted=""
          for _ in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before boot completion." >&2
              tail -n 200 runtime-evidence/emulator.log >&2 || true
              exit 1
            fi
            booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            echo "Android emulator did not complete boot within the bounded wait." >&2
            tail -n 200 runtime-evidence/emulator.log >&2 || true
            exit 1
          fi
          "$ADB" shell input keyevent 82 || true

          APK="dogfood-apk/app-release.apk"
          test -s "$APK"
          "$ADB" install -r "$APK" | tee runtime-evidence/install.txt

          COMPONENT="$("$ADB" shell cmd package resolve-activity --brief com.sesliogren.app | tr -d '\r' | tail -n 1)"
          test -n "$COMPONENT"
          echo "$COMPONENT" > runtime-evidence/component.txt
          "$ADB" shell am start -W -n "$COMPONENT" | tee runtime-evidence/launch.txt
          sleep 5

          PID="$("$ADB" shell pidof com.sesliogren.app | tr -d '\r')"
          test -n "$PID"
          echo "$PID" > runtime-evidence/pid.txt

          FOCUS="$("$ADB" shell dumpsys window | tr -d '\r' | grep -m1 'mCurrentFocus' || true)"
          echo "$FOCUS" | tee runtime-evidence/focus.txt
          printf '%s' "$FOCUS" | grep -Fq "com.sesliogren.app"

          dump_ui() {
            local target="$1"
            local remote="/sdcard/window.xml"
            local attempt
            for attempt in 1 2 3 4 5; do
              "$ADB" shell rm -f "$remote" >/dev/null 2>&1 || true
              timeout 20 "$ADB" shell uiautomator dump --compressed "$remote" >/dev/null 2>&1 || true
              if "$ADB" shell test -s "$remote" >/dev/null 2>&1; then
                "$ADB" pull "$remote" "$target" >/dev/null
                if [ -s "$target" ]; then
                  return 0
                fi
              fi
              sleep 2
            done
            echo "UI hierarchy unavailable after retries: $target" >&2
            return 1
          }

          capture_screen() {
            local name="$1"
            "$ADB" exec-out screencap -p > "runtime-evidence/$name.png"
            test -s "runtime-evidence/$name.png"
            # A screenshot is valid runtime evidence even when UiAutomator is
            # temporarily unable to reach an idle state. Preserve the PNG and
            # attach XML opportunistically instead of failing the capture.
            dump_ui "runtime-evidence/$name.xml" || true
          }

          tap_text() {
            local label="$1"
            local evidence="$2"
            local ui_file="runtime-evidence/$evidence.xml"
            dump_ui "$ui_file"
            local coords
            coords="$(python3 - "$ui_file" "$label" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          
          ui_file, label = sys.argv[1], sys.argv[2]
          root = ET.parse(ui_file).getroot()
          for node in root.iter("node"):
              text = node.attrib.get("text", "")
              desc = node.attrib.get("content-desc", "")
              if label not in (text, desc) and label not in text and label not in desc:
                  continue
              match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
              if not match:
                  continue
              x1, y1, x2, y2 = map(int, match.groups())
              if x2 <= x1 or y2 <= y1:
                  continue
              print((x1 + x2) // 2, (y1 + y2) // 2)
              raise SystemExit(0)
          raise SystemExit(2)
          PY
            )" || {
              echo "Could not find tappable runtime text: $label" >&2
              cat "$ui_file" >&2 || true
              return 1
            }
            read -r x y <<< "$coords"
            "$ADB" shell input tap "$x" "$y"
            sleep 2
          }

          capture_screen launch
          tap_text "Kütüphane" tap-library
          capture_screen library
          tap_text "İlerleme" tap-progress
          capture_screen progress
          tap_text "Profil" tap-profile
          capture_screen profile
          tap_text "Hesap bağla · isteğe bağlı" tap-account-entry
          capture_screen account-entry

          scroll_up() {
            local size width height x from_y to_y
            size="$("$ADB" shell wm size | tr -d '\r' | tail -n 1 | awk '{print $NF}')"
            width="${size%x*}"
            height="${size#*x}"
            x=$((width / 2))
            from_y=$((height * 4 / 5))
            to_y=$((height * 2 / 5))
            "$ADB" shell input swipe "$x" "$from_y" "$x" "$to_y" 350
            sleep 1
          }

          scroll_up
          scroll_up
          capture_screen account-entry-form
          if ! tap_text "Hesapsız devam et" tap-continue-local-1; then
            scroll_up
            if ! tap_text "Hesapsız devam et" tap-continue-local-2; then
              scroll_up
              tap_text "Hesapsız devam et" tap-continue-local-3
            fi
          fi
          capture_screen home-after-account-entry
          tap_text "İlk kaynağımı ekle" tap-add-source
          capture_screen add-source

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK_ROOT/platform-tools/adb"
          mkdir -p runtime-evidence
          timeout 15 "$ADB" logcat -d -t 800 > runtime-evidence/logcat.txt 2>&1 || true
          timeout 15 "$ADB" shell dumpsys activity activities > runtime-evidence/activities.txt 2>&1 || true
          timeout 15 "$ADB" shell dumpsys package com.sesliogren.app > runtime-evidence/package.txt 2>&1 || true

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sesli-ogren-android-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime-evidence
          if-no-files-found: error
          retention-days: 7

  ios-release-compile:
    needs: milestone-gate
    if: needs.milestone-gate.outputs.run_full == 'true'
    name: iOS simulator compile (no signing)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: flutter_pin
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Compile iOS simulator app without provisioning
        run: |
          flutter build ios --simulator --no-codesign --no-pub
          test -d build/ios/iphonesimulator/Runner.app
